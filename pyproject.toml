[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpfrisk"
version = "0.1.0"
description = "Security linting for MCP servers, before they ship."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Imre Obermueller", email = "imre.obermueller@gmail.com" }
]
keywords = ["mcp", "model-context-protocol", "security", "linter", "ci", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

# Bewusst leer: Tier 1 (statische Checks) braucht keine externen Pakete,
# nur die Python-Standardbibliothek (ast, re, pathlib). Das hält die
# Installation trivial und die Angriffsfläche durch eigene Dependencies
# klein -- passend für ein Security-Tool. Auch der erste Tier-2-Check
# (AUTH_BOUNDARY) kommt mit stdlib `urllib` aus -- noch keine externe
# Abhängigkeit nötig. Falls ein künftiger dynamischer Check das `mcp`-SDK
# o.ä. zwingend braucht: als optionales Extra ergänzen, nicht als Pflicht.
dependencies = []

# Optionales Extra für die JS/TS-Analyse (Tier 1, sprach-agnostischer SourceModel-Port).
# Der Basis-Install bleibt bewusst stdlib-only (dependencies = []); wer JS/TS-Server
# mit gleicher Tiefe wie Python scannen will, installiert mcpfrisk[jsts]. Der
# tree-sitter-Parser wird ausschließlich im Infrastruktur-Adapter (core/sourcetree)
# verwendet, nie direkt in den Checks. Fehlt das Extra, werden JS/TS-Dateien sauber
# übersprungen (nie als "clean" gewertet), statt zu crashen.
[project.optional-dependencies]
jsts = [
    "tree-sitter>=0.21",
    "tree-sitter-typescript",
    "tree-sitter-javascript",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "tree-sitter>=0.21",
    "tree-sitter-typescript",
    "tree-sitter-javascript",
]

[project.scripts]
mcpfrisk = "mcpfrisk.cli:main"

[project.urls]
Homepage = "https://github.com/Imre7777/mcpfrisk"
Issues = "https://github.com/Imre7777/mcpfrisk/issues"

[tool.setuptools.packages.find]
include = ["mcpfrisk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
