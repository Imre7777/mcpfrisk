[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpfrisk"
version = "0.1.0"
description = "Security linting for MCP servers, before they ship."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Imre Obermueller", email = "imre.obermueller@gmail.com" }
]
keywords = ["mcp", "model-context-protocol", "security", "linter", "ci", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

# Bewusst leer: Tier 1 (statische Checks) braucht keine externen Pakete,
# nur die Python-Standardbibliothek (ast, re, pathlib). Das hält die
# Installation trivial und die Angriffsfläche durch eigene Dependencies
# klein -- passend für ein Security-Tool. Tier 2 (dynamische Checks)
# wird vermutlich `mcp`/`httpx` o.ä. brauchen; dann hier ergänzen.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
mcpfrisk = "mcpfrisk.cli:main"

[project.urls]
Homepage = "https://github.com/Imre7777/mcpfrisk"
Issues = "https://github.com/Imre7777/mcpfrisk/issues"

[tool.setuptools.packages.find]
include = ["mcpfrisk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
