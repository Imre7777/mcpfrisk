name: Feature request
description: A new check, a new output format, or another improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Proposals for **new security checks** are especially welcome — please
        include the relevant research (CWE/OWASP-MCP mapping, a real-world
        example) so it can start from evidence.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What gap or risk does this address? Who hits it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should McpFrisk do? For a new check, describe the vulnerable pattern and the clean counter-example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, existing tools, or why the status quo is insufficient.
    validations:
      required: false
  - type: input
    id: references
    attributes:
      label: References
      description: CWE/OWASP-MCP IDs, CVEs, blog posts, spec sections.
    validations:
      required: false
