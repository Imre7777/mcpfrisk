name: Cross-Platform

# Plattform-Nachweis für Windows + macOS -- bewusst NICHT bei jedem Push, sondern
# nur WÖCHENTLICH (und manuell auslösbar). Grund: auf privaten Repos zählen
# Windows-Runner 2x und macOS-Runner 10x Minuten. Einmal pro Woche reicht, um
# Plattform-Regressionen (Pfad-Logik \ vs /, is_excluded/Ignore aus Feature 022)
# rechtzeitig zu bemerken, ohne bei jedem Commit Minuten zu verbrennen.
on:
  schedule:
    - cron: "0 6 * * 1"   # jeden Montag 06:00 UTC
  workflow_dispatch:       # jederzeit manuell über "Run workflow" startbar

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Ein OS-Fehlschlag soll den anderen nicht abbrechen -- volles Bild.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    # bash auf allen Runnern (Windows bringt Git-Bash mit), damit die
    # bash-basierten Dogfood-Schritte portabel sind.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies (includes jsts/tree-sitter)
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest tests/ -q

      - name: Dogfood -- self-scan our own source must stay clean
        run: mcpfrisk scan mcpfrisk/ --fail-on medium
