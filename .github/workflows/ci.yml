name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies (includes jsts/tree-sitter)
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest tests/ -v --cov=mcpfrisk --cov-report=term-missing

      # Dogfooding: mcpfrisk scannt seine eigenen Test-Fixtures und
      # demonstriert in den CI-Logs, dass die Findings wie erwartet kommen.
      # Das ist kein Ersatz für die pytest-Suite oben, sondern ein
      # zusätzlicher Sichtbarkeits-Check (zeigt im CI-Log das, was ein
      # Nutzer beim echten Einsatz auch sehen würde).
      - name: Dogfood -- scan the vulnerable fixture (expected to fail)
        run: |
          mcpfrisk scan tests/fixtures/vulnerable_server.py --fail-on critical || true

      - name: Dogfood -- scan the clean fixture (expected to pass)
        run: |
          mkdir -p /tmp/clean-only
          cp tests/fixtures/clean_server.py /tmp/clean-only/
          mcpfrisk scan /tmp/clean-only --fail-on high

      - name: Dogfood -- scan a vulnerable TypeScript fixture (expected to fail)
        run: |
          mcpfrisk scan tests/fixtures/jsts/tool_poisoning_vuln.ts --fail-on critical || true

  # Eigenständiger Job OHNE das jsts-Extra: stellt sicher, dass der Basis-Install
  # ohne tree-sitter weder beim Import noch beim Scan crasht und JS/TS-Dateien
  # sauber übersprungen werden (nie fälschlich als "clean"). Die jsts-markierten
  # Tests werden hier automatisch geskippt; der Degradations-Pfad wird über
  # monkeypatch-Tests (test_jsts_robustness/test_sourcetree) trotzdem geprüft.
  test-without-jsts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install base package (NO jsts extra) + pytest
        run: |
          pip install -e .
          pip install pytest pytest-cov

      - name: Run suite without the JS/TS parser
        run: pytest tests/ -q

      - name: Dogfood -- scanning a TS file must not crash without jsts
        run: |
          mcpfrisk scan tests/fixtures/jsts/cmd_injection_vuln.ts --fail-on critical || true

  # Self-test der wiederverwendbaren GitHub Action (action.yml) im eigenen
  # Repo: `uses: ./` referenziert die lokale Action statt eines veröffentlichten
  # Tags. Prüft, dass die Action selbst (Install aus github.action_path, SARIF-
  # Upload, Exit-Code-Weitergabe) tatsächlich funktioniert -- nicht nur die
  # rohe CLI wie in den Jobs oben.
  test-action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # für den SARIF-Upload nach GitHub Code Scanning
    steps:
      - uses: actions/checkout@v4

      - name: Prepare an isolated clean-fixture directory
        run: |
          mkdir -p /tmp/action-clean-only
          cp tests/fixtures/clean_server.py /tmp/action-clean-only/

      - name: Action against the clean fixture (expected to pass)
        uses: ./
        with:
          path: /tmp/action-clean-only
          fail-on: high

      - name: Action against the vulnerable fixture (expected to fail)
        id: vuln_scan
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/vulnerable_server.py
          fail-on: critical

      - name: Verify the action actually gated the vulnerable fixture
        run: |
          if [ "${{ steps.vuln_scan.outcome }}" != "failure" ]; then
            echo "Expected the action to fail on the vulnerable fixture, but it didn't." >&2
            exit 1
          fi
          echo "OK: action correctly failed on the vulnerable fixture."
