name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Actions sind bewusst auf volle Commit-SHAs gepinnt (Supply-Chain-Härtung eines
# Security-Tools): ein bewegliches Tag wie @v4 könnte sich still ändern. Der
# `# vX`-Kommentar hält die Lesbarkeit; Dependabot (github-actions) aktualisiert
# die SHAs kontrolliert per PR.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint (ruff)
        run: ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Ein OS-Fehlschlag soll die anderen Matrix-Zweige NICHT abbrechen -- wir
      # wollen das vollständige Cross-Platform-Bild sehen.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        # Linux trägt die volle Python-Matrix; Windows und macOS je einmal auf
        # der aktuellsten unterstützten Version (Plattform-Nachweis: Pfad-Logik
        # \ vs /, besonders der is_excluded/Ignore-Code aus Feature 022).
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    # Alle run-Schritte über bash -- auch auf Windows-Runnern (bringen Git-Bash
    # mit), damit die bash-basierten Dogfood-Schritte portabel bleiben.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies (includes jsts/tree-sitter)
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest tests/ -v --cov=mcpfrisk --cov-report=term-missing --cov-fail-under=88

      # Dogfooding: mcpfrisk scannt seinen EIGENEN Quellcode und muss sauber sein.
      # Das ist das stärkste Vertrauenssignal für ein Security-Tool. Bewusst nur
      # `mcpfrisk/` (echter Code), NICHT `.` -- das Repo enthält absichtlich
      # verwundbare tests/fixtures/. Läuft auf allen drei OS und prüft damit
      # zugleich die Pfad-Behandlung des echten Scans unter Windows/macOS.
      - name: Dogfood -- self-scan our own source must stay clean
        run: mcpfrisk scan mcpfrisk/ --fail-on medium

      # Dogfooding: mcpfrisk scannt seine eigenen Test-Fixtures und
      # demonstriert in den CI-Logs, dass die Findings wie erwartet kommen.
      # Das ist kein Ersatz für die pytest-Suite oben, sondern ein
      # zusätzlicher Sichtbarkeits-Check (zeigt im CI-Log das, was ein
      # Nutzer beim echten Einsatz auch sehen würde).
      - name: Dogfood -- scan the vulnerable fixture (expected to fail)
        run: |
          mcpfrisk scan tests/fixtures/vulnerable_server.py --fail-on critical || true

      - name: Dogfood -- scan the clean fixture (expected to pass)
        run: |
          mkdir -p /tmp/clean-only
          cp tests/fixtures/clean_server.py /tmp/clean-only/
          mcpfrisk scan /tmp/clean-only --fail-on high

      - name: Dogfood -- scan a vulnerable TypeScript fixture (expected to fail)
        run: |
          mcpfrisk scan tests/fixtures/jsts/tool_poisoning_vuln.ts --fail-on critical || true

  # Supply-Chain-Selbstprüfung: Wir predigen DEPENDENCY_SCAN/PACKAGE_PROVENANCE --
  # also auditieren wir unsere eigene (reale) Lieferkette gegen bekannte
  # Advisories. Der Kern ist zero-dep; die einzige echte Laufzeit-Lieferkette ist
  # das jsts-Extra (tree-sitter). Bewusst blockierend: ein Advisory soll sichtbar
  # sein, nicht stillschweigend durchgehen.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install runtime supply chain + pip-audit
        run: pip install -e ".[jsts]" pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit

  # Eigenständiger Job OHNE das jsts-Extra: stellt sicher, dass der Basis-Install
  # ohne tree-sitter weder beim Import noch beim Scan crasht und JS/TS-Dateien
  # sauber übersprungen werden (nie fälschlich als "clean"). Die jsts-markierten
  # Tests werden hier automatisch geskippt; der Degradations-Pfad wird über
  # monkeypatch-Tests (test_jsts_robustness/test_sourcetree) trotzdem geprüft.
  test-without-jsts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install base package (NO jsts extra) + pytest
        run: |
          pip install -e .
          pip install pytest pytest-cov

      - name: Run suite without the JS/TS parser
        run: pytest tests/ -q

      - name: Dogfood -- scanning a TS file must not crash without jsts
        run: |
          mcpfrisk scan tests/fixtures/jsts/cmd_injection_vuln.ts --fail-on critical || true

  # Self-test der wiederverwendbaren GitHub Action (action.yml) im eigenen
  # Repo: `uses: ./` referenziert die lokale Action statt eines veröffentlichten
  # Tags. Prüft, dass die Action selbst (Install aus github.action_path, Scan,
  # SARIF-Erzeugung, Exit-Code-Weitergabe) tatsächlich funktioniert -- nicht nur
  # die rohe CLI wie in den Jobs oben.
  #
  # Der SARIF-UPLOAD wird hier bewusst abgeschaltet (`upload-sarif: false`):
  #   (1) dieses Repo ist privat ohne GitHub Advanced Security -- der Code-
  #       Scanning-Upload wäre gar nicht zugänglich ("Resource not accessible
  #       by integration"), und
  #   (2) selbst mit GHAS würde der Selbsttest sonst FIXTURE-Schwachstellen in
  #       den echten Security-Tab schreiben (Verschmutzung mit Testdaten).
  # Der Upload selbst ist GitHubs codeql-action, nicht unser Code -- wir testen
  # unsere Action (Install/Scan/Gate), nicht GitHubs Upload.
  test-action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare an isolated clean-fixture directory
        run: |
          mkdir -p /tmp/action-clean-only
          cp tests/fixtures/clean_server.py /tmp/action-clean-only/

      - name: Action against the clean fixture (expected to pass)
        uses: ./
        with:
          path: /tmp/action-clean-only
          fail-on: high
          upload-sarif: false

      - name: Action against the vulnerable fixture (expected to fail)
        id: vuln_scan
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/vulnerable_server.py
          fail-on: critical
          upload-sarif: false

      - name: Verify the action actually gated the vulnerable fixture
        run: |
          if [ "${{ steps.vuln_scan.outcome }}" != "failure" ]; then
            echo "Expected the action to fail on the vulnerable fixture, but it didn't." >&2
            exit 1
          fi
          echo "OK: action correctly failed on the vulnerable fixture."
