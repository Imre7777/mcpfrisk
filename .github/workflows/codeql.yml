name: CodeQL

# DORMANT (bewusst nur manuell auslösbar): Dieses Repo ist aktuell PRIVAT OHNE
# GitHub Advanced Security. CodeQL-Code-Scanning kann auf privaten Repos ohne
# GHAS keine Ergebnisse hochladen (der analyze-Schritt schlüge fehl) -- ein
# aktiver push/pull_request-Trigger würde die CI also rot färben.
#
# SOBALD DAS REPO PUBLIC IST (CodeQL ist für öffentliche Repos kostenlos):
#   den `on:`-Block unten ersetzen durch:
#     on:
#       push: { branches: [main] }
#       pull_request: { branches: [main] }
#       schedule: [{ cron: "27 3 * * 1" }]   # wöchentlich, Montag früh
#
# Bis dahin bleibt die Konfiguration einsatzbereit und per "Run workflow"
# manuell testbar, ohne die reguläre CI zu gefährden.
on:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
