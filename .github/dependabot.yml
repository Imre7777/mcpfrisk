version: 2
updates:
  # Python-Abhängigkeiten (Dev-/jsts-Extras; der Kern ist zero-dep). Hält v.a.
  # die gepinnten tree-sitter-Obergrenzen und die Dev-Tools aktuell.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  # GitHub Actions: hält die auf Commit-SHA gepinnten Actions in ci.yml,
  # action.yml und codeql.yml kontrolliert aktuell (PR pro Update).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
